name: Monitor fondos CEF
on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC (08:30 o 09:30 en Madrid según la época del año)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar cambios
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add vistas.json docs/index.html
          git diff --cached --quiet || (git commit -m "Actualizar vistas y página" && git push)
