name: Monitor fondos CEF
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    paths: ["data/**", "programas.json"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar cambios
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add vistas.json noticias.json docs/data.json
          git diff --cached --quiet || (git commit -m "Actualizar datos y novedades" && git push)
